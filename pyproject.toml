[project]
name = "edu_quality"
authors = [
    { name = "Hybrowlabs Technologies", email = "contact@hybrowlabs.com" },
]
description = "Education management app for Frappe (admissions, fees, attendance, assessments)"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dynamic = ["version"]
dependencies = [
    # frappe -- https://github.com/frappe/frappe is installed via 'bench init'
    "mysql-connector-python",
    "qrcode==8.0",
    "pymupdf==1.25.3",
    "autocrop==1.3.0",
    "opencv-python-headless==4.13.0.92",
    "pydyf==0.10.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # unused imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    # -- deferred for OSS-prep cleanup: pre-existing violations need per-site review --
    "B006", # mutable default argument
    "B007", # unused loop control variable
    "E722", # bare except
    "F841", # local variable assigned but never used
    # -- end deferred --
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
